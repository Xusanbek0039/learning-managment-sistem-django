name: Secret scan

# Scans only the new commits of each push / pull request with gitleaks (open source, MIT).
# Findings are redacted in the log. A full-history scan can be started manually
# (workflow_dispatch → full_history = true). It will report the historical leaks until
# the history cleanup described in docs/ROADMAP.md is done.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_history:
        description: "Scan the entire git history"
        type: boolean
        default: false

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.21.2"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks version

      - name: Work out the commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FULL: ${{ inputs.full_history }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$FULL" = "true" ]; then
            echo "opts=--all" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "pull_request" ]; then
            echo "opts=${BASE_SHA}..${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            echo "opts=${BEFORE}..${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "opts=-1" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan
        env:
          LOG_OPTS: ${{ steps.range.outputs.opts }}
        run: ./gitleaks git --redact --verbose --log-opts="$LOG_OPTS" .

name: Python lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install ruff
        run: pip install "ruff>=0.6,<1"
      # Start with errors that are always bugs: syntax errors and undefined names.
      # Stricter rule sets will be enabled gradually (see docs/DEVELOPMENT.md).
      - name: Ruff (syntax errors and undefined names)
        run: >
          ruff check --output-format=github
          --select E9,F63,F7,F82
          --exclude venv,.venv,staticfiles,ilovalar,node_modules
          .
